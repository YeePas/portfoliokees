# Configuratie voor Pages CMS (https://pagescms.org)
media:
  input: assets/images
  output: /assets/images
  categories: [image]

content:
  - name: posts
    label: Klusprojecten
    type: collection
    path: _posts
    filename: "{year}-{month}-{day}-{primary}.md"
    view:
      fields: [title, date]
      primary: title
      sort: [date]
      default:
        sort: date
        order: desc
    fields:
      - name: title
        label: Titel
        type: string
        required: true
      - name: date
        label: Datum
        type: date
        required: true
      - name: body
        label: Tekst en foto's
        type: rich-text
